name: daily

# Collect last night's box scores, retrain the EQUINE winner model, forecast
# the next slate with TimesFM, commit the data, and redeploy the JSON to Pages.
on:
  # GitHub delays or drops scheduled runs under load (the first 21:30 run
  # never fired), most often near the top of the hour. Every run is
  # idempotent, so each slot has a later backup and minutes are off-peak.
  schedule:
    - cron: "23 10 * * *" # 10:23 UTC (6:23 EDT / 5:23 EST): every game of the night is final
    - cron: "41 12 * * *" # backup for the morning run
    - cron: "37 21 * * *" # 21:37 UTC (5:37 EDT / 4:37 EST): the afternoon injury report
    - cron: "11 23 * * *" # pre-tip refresh, and backup for the afternoon run
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also rerun the walk-forward backtest"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TQDM_DISABLE: "1" # EQUINE's per-epoch progress bars
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Cache the TimesFM checkpoint
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-timesfm-2.5-200m-pytorch

      - name: Run the daily pipeline
        run: uv run --frozen nbapredicts --cache "$RUNNER_TEMP/espn" daily

      # The backtest takes several minutes: Monday mornings, on request, or
      # whenever its output is missing.
      - name: Backtest
        env:
          REQUESTED: ${{ inputs.backtest }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$REQUESTED" = "true" ] || [ ! -f site/data/backtest.json ] ||
             { [ "$SCHEDULE" = "23 10 * * *" ] && [ "$(date -u +%u)" = "1" ]; }; then
            uv run --frozen nbapredicts --cache "$RUNNER_TEMP/espn" backtest
          else
            echo "skipping the backtest today"
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            # A push may have landed while this run was working. Every run
            # regenerates its data, so if main now conflicts with it, skip
            # this commit rather than fail; the next run catches up.
            if git pull --rebase origin main; then
              git push origin HEAD:main
            else
              git rebase --abort
              echo "::warning::main changed the same data files during this run; data commit skipped"
            fi
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
